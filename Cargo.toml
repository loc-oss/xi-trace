[package]
name = "xi-trace"
version = "0.2.0"
license = "Apache-2.0"
authors = [
    "Vitali Lovich <vlovich@google.com>",
    "LOC-OSS Community"
]
categories = ["development-tools::profiling"]
repository = "https://github.com/loc-oss/xi-trace"
description = "Library-based distributed tracing API to meet the needs of xi-core, frontends and plugins"
edition = '2024'

[features]
default = ["chrome_trace_event"]
json_payload = ["serde_json"]
getpid = []
chrome_trace_event = ["serde_json"]
ipc = ["bincode"]

[dependencies]
time = "0.2"
lazy_static = "1.0"
serde_json = { version = "1.0", optional = true }
serde_derive = "1.0"
serde = "1.0"
libc = "0.2"
log = "0.4.3"
bincode = { version = "1.0", optional = true }

[dev-dependencies]
serde_json = "1.0"